<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NotByHuman Detector</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h2 {
      font-size: 1.1rem;
      margin: 0;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 8px;
      color: #f1f5f9;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:disabled {
      opacity: 0.5;
    }
    .result-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
    }
    .score {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-rose { background: rgba(244, 63, 94, 0.2); color: #f43f5e; }
    .badge-amber { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
    .badge-green { background: rgba(16, 185, 129, 0.2); color: #10b981; }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span>
    <h2>NotByHuman AI Scan</h2>
  </div>

  <textarea id="textInput" rows="5" placeholder="Paste text or highlight text on page..."></textarea>
  <button id="scanBtn">Analyze Text</button>

  <div id="resultBox" class="result-box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div id="scoreDisplay" class="score">--%</div>
      <span id="riskBadge" class="badge">--</span>
    </div>
    <div id="verdictText" style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
